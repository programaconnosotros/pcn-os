# Name of your application. Used to uniquely configure containers.
service: pcn-website

servers:
  web:
    - 3.18.43.150

image: pcn-website

# Enable SSL auto certification via Let's Encrypt (and allow for multiple apps on one server).
# If using something like Cloudflare, it is recommended to set encryption mode
# in Cloudflare's SSL/TLS setting to "Full" to enable end-to-end encryption.
proxy:
  # programaconnosotros.com points straight at this host: CloudFront only serves the S3 files.
  # origin.programaconnosotros.com (also this host) is for the day the site moves behind CloudFront,
  # which would reach the app through it. Both get a Let's Encrypt certificate here, so the site
  # keeps working before and after that DNS switch.
  hosts:
    - programaconnosotros.com
    - origin.programaconnosotros.com
  ssl: true
  app_port: 3000

# Credentials for your image host.
registry:
  server: 934012604814.dkr.ecr.us-east-2.amazonaws.com
  username: AWS
  # Assumes default profile
  password: <%= %x(aws ecr get-login-password) %>

# Configure builder setup.
builder:
  arch: amd64
  context: .
  dockerfile: Dockerfile.prod
  cache:
    type: gha

env:
  secret:
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - POSTGRES_DB
    - DATABASE_URL
    - AUTH_TOKEN
    - AUTH_SECRET
    - AUTH_GITHUB_ID
    - AUTH_GITHUB_SECRET
    - AUTH_TRUST_HOST
    - TWO_FACTOR_ENCRYPTION_KEY
    - AWS_REGION
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_S3_BUCKET
    - AWS_CLOUDFRONT_URL
    - AWS_CLOUDFRONT_KEY_PAIR_ID
    - AWS_CLOUDFRONT_PRIVATE_KEY_BASE64
    - RESEND_API_KEY
    - AI_GATEWAY_API_KEY
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
    - VAPID_SUBJECT
    - CLOUDFRONT_ORIGIN_SECRET

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
#
# aliases:
#   shell: app exec --interactive --reuse "bash"

# Use a different ssh user than root
#
ssh:
  user: ubuntu

# The image builds on the runner for several minutes while the SSH connection opened for
# `docker login` sits idle and gets reset by the host; don't reuse connections idle that long.
sshkit:
  pool_idle_timeout: 60
# Use a persistent storage volume.
#
# volumes:
#   - "app_storage:/app/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
#
# asset_path: /app/public/assets

# Configure rolling deploys by setting a wait time between batches of restarts.
#
# boot:
#   limit: 10 # Can also specify as a percentage of total hosts, such as "25%"
#   wait: 2

# Use accessory services (secrets come from .kamal/secrets).
